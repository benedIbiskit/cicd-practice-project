# Название workflow
name: Release Build

# Триггер: запускать только при создании нового тега (например, v1.0.0)
on:
  push:
    tags:
      - 'v*'

# Задачи
jobs:
  build-package:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Клонируем код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Устанавливаем утилиту build для сборки пакетов
      - name: Install build tool
        run: python -m pip install --upgrade pip build

      # 4. Собираем исходный код в пакет (.whl и .tar.gz)
      - name: Build package
        run: python -m build

      # 5. Сохраняем собранные файлы как артефакт (чтобы их можно было скачать)
      - name: Store build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
